<form class="entity-form" hx-post="/finance/recurring" hx-swap="none"><h2>Add recurring item</h2><p class="finance-form-privacy">Use an alias such as “Housing” or “Index contribution”; do not enter company or account identifiers.</p><label>Alias <input name="name" required maxlength="80" placeholder="Housing"></label><div class="form-row"><label>Account <select name="account_id"><option value="">No account</option>{% for account in accounts %}<option value="{{ account.id }}">{{ account.name }}</option>{% endfor %}</select></label><label>Category <input name="category" required maxlength="60"></label></div><div class="form-row"><label>Amount <input type="number" step="0.01" name="amount" required></label><label>Cadence <select name="cadence"><option>weekly</option><option selected>monthly</option><option>quarterly</option><option>yearly</option></select></label><label>Next due <input type="date" name="next_due_date" required value="{{ today }}"></label></div><input type="hidden" name="active" value="1"><div class="form-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary">Save</button></div></form>
