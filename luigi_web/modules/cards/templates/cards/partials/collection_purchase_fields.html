<div class="cards-form-grid collection-purchase-fields">
  {% if not lot %}<label>Quantity<input name="qty" type="number" value="1" min="1" max="9999" required></label><label>Condition<select name="condition">{% for condition in ['NM','LP','MP','HP','DMG'] %}<option>{{ condition }}</option>{% endfor %}</select></label><label class="cards-check"><input type="checkbox" name="foil" value="1">Foil</label>{% else %}<input type="hidden" name="foil" value="{{ lot.foil }}">{% endif %}
  <label>Purchase date<input name="acquired_date" type="date" value="{{ lot.acquired_date or '' if lot else '' }}"></label>
  <label>Price source<select name="price_source"><option value="entered" {{ 'selected' if not lot or lot.price_source in ['entered','legacy_summary'] }}>{{ 'Legacy cost override' if lot and lot.price_source == 'legacy_summary' else 'Actual paid' }}</option>{% if not lot or lot.price_source != 'legacy_summary' %}<option value="market_estimate" {{ 'selected' if lot and lot.price_source == 'market_estimate' }}>Market estimate</option><option value="unknown" {{ 'selected' if lot and lot.price_source == 'unknown' }}>Unknown</option>{% endif %}</select></label>
  <label>Actual unit price<input name="acquired_price" type="number" min="0" step="0.01" inputmode="decimal" value="{% if lot and lot.unit_price_minor is not none and lot.price_source in ['entered','legacy_summary'] %}{{ lot.unit_price_minor // 100 }}.{{ '%02d' | format(lot.unit_price_minor % 100) }}{% endif %}"></label>
  <label>Currency<select name="acquired_currency"><option {{ 'selected' if not lot or lot.currency == 'USD' }}>USD</option><option {{ 'selected' if lot and lot.currency == 'EUR' }}>EUR</option></select></label>
  {% if not lot or lot.price_source != 'legacy_summary' %}
  <div class="cards-field-wide collection-estimate-controls"><button type="button" class="btn" data-collection-estimate>{{ icon('search') }} Check purchase-day market</button><output data-collection-estimate-output aria-live="polite">No estimate selected</output><label class="cards-check"><input type="checkbox" name="estimate_confirmed" value="true">Confirm historical market estimate, not actual paid</label></div>
  {% endif %}
</div>
