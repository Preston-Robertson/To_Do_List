{% for row in rows %}
<button type="button" data-collection-select="{{ row.id }}" data-card-name="{{ row.name }}">{% if row.image_small %}<img src="{{ row.image_small }}" alt="" width="34" height="48" loading="lazy">{% endif %}<span>{{ row.name }} &middot; {{ row.set_code or '-' }} {{ row.collector_number or '' }}</span></button>
{% else %}<p>No matching printings</p>{% endfor %}
