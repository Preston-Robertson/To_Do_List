<div class="deck-detail-meta" id="deck-summary"{% if refresh_summary %} hx-swap-oob="outerHTML"{% endif %}>
  <span>{{ deck.format or 'No format' }}</span>
  <span>{{ total_qty }} cards</span>
  <span>{{ total_price_minor | money_minor }}</span>
  {% if deck.commander_name %}<span>{{ deck.commander_name }}</span>{% endif %}
</div>
