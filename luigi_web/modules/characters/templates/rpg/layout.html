{% extends "base.html" %}
{% block head_scripts %}
  {{ super() }}
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/static/css/rpg.css?v={{ asset_version }}">
  <script src="/static/js/rpg.js?v={{ asset_version }}" defer></script>
{% endblock %}
{% block content %}
<section class="rpg-workspace {% block rpg_page_class %}{% endblock %}" data-rpg-workspace>
  <nav class="rpg-feature-nav" aria-label="Character tools">
    <a href="/characters"
       class="{% if not request.url.path.startswith('/characters/library') %}active{% endif %}"
       {% if not request.url.path.startswith('/characters/library') %}aria-current="page"{% endif %}>Characters</a>
    <a href="/characters/library"
       class="{% if request.url.path.startswith('/characters/library') %}active{% endif %}"
       {% if request.url.path.startswith('/characters/library') %}aria-current="page"{% endif %}>Library</a>
  </nav>
  {% block rpg_content %}{% endblock %}
</section>
{% endblock %}
