[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luigi-web-admin"
version = "0.2.0"
description = "Luigi Web authenticated administration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["luigi-web>=0.2,<0.3", "fastapi==0.115.0", "httpx==0.27.2"]

[project.entry-points."luigi_web.modules"]
admin = "luigi_web.modules.admin.manifest:module"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["luigi_web.modules.admin*"]
namespaces = true

[tool.setuptools.package-data]
"luigi_web.modules.admin" = ["templates/**/*.html", "static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.env*", "**/LOCAL_*", "**/*.db*", "**/*.sqlite*", "**/*credentials*"]