[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luigi-web-finance"
version = "0.2.0"
description = "Luigi Web separately unlocked local finance workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["luigi-web>=0.2,<0.3", "fastapi==0.115.0", "starlette>=0.37.2,<0.39"]

[project.entry-points."luigi_web.modules"]
finance = "luigi_web.modules.finance.manifest:module"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["luigi_web.modules.finance*"]
namespaces = true

[tool.setuptools.package-data]
"luigi_web.modules.finance" = ["templates/**/*.html", "static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.env*", "**/LOCAL_*", "**/*.db*", "**/*.sqlite*", "**/*credentials*"]