<form class="entity-form" hx-post="/finance/holdings" hx-swap="none"><h2>Add or update holding</h2><p class="finance-form-privacy">Use a public ticker and optional alias only. Do not enter brokerage account identifiers.</p><label>Investment account <select name="account_id" required>{% for account in accounts %}<option value="{{ account.id }}">{{ account.name }}</option>{% endfor %}</select></label><div class="form-row"><label>Symbol <input name="symbol" maxlength="16" required placeholder="EXAMPLE"></label><label>Asset alias <input name="asset_name" maxlength="80" placeholder="Optional"></label></div><div class="form-row"><label>Quantity <input type="number" step="0.000001" min="0" name="quantity" required></label><label>Cost basis <input type="number" step="0.01" min="0" name="cost_basis" value="0.00"></label><label>Market value <input type="number" step="0.01" min="0" name="market_value" value="0.00"></label></div><label>As of <input type="date" name="as_of_date" required value="{{ today }}"></label><div class="form-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary">Save holding</button></div></form>
