<form class="entity-form" hx-post="{{ '/finance/accounts/' ~ account.id if account else '/finance/accounts' }}" hx-swap="none">
  <h2>{{ 'Edit account alias' if account else 'Add account alias' }}</h2>
  <p class="finance-form-privacy">Use a nickname only. Never enter an institution name paired with an account number or any personal identifier.</p>
  <label>Account alias <input name="name" required maxlength="60" value="{{ account.name if account else '' }}" placeholder="Everyday account"></label>
  <div class="form-row"><label>Type <select name="account_type">{% for value in ['checking','savings','cash','credit','investment','other'] %}<option value="{{ value }}" {% if account and account.account_type == value %}selected{% endif %}>{{ value|title }}</option>{% endfor %}</select></label><label>Currency <input name="currency" required maxlength="3" readonly value="{{ account.currency if account else base_currency }}"><small>Reports use one base currency.</small></label></div>
  <label>Opening balance <input type="number" step="0.01" name="opening_balance" required value="{{ account.opening_balance if account else '0.00' }}"></label>
  {% if account %}<input type="hidden" name="active" value="0"><label class="checkbox"><input type="checkbox" name="active" value="1" {% if account.active %}checked{% endif %}> Active</label>{% endif %}
  <div class="form-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
</form>
