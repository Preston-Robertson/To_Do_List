[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luigi-web-media"
version = "0.2.0"
description = "Luigi Web games, shows and media integrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["luigi-web>=0.2,<0.3", "fastapi==0.115.0", "httpx==0.27.2", "starlette>=0.37.2,<0.39", "gspread==6.1.2", "google-auth==2.34.0"]

[project.entry-points."luigi_web.modules"]
media = "luigi_web.modules.media.manifest:module"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["luigi_web.modules.media*"]
namespaces = true

[tool.setuptools.package-data]
"luigi_web.modules.media" = ["templates/**/*.html", "static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.env*", "**/LOCAL_*", "**/*.db*", "**/*.sqlite*", "**/*credentials*"]