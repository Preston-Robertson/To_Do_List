[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luigi-web-assistant"
version = "0.2.0"
description = "Luigi Web bounded assistant providers and task tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["luigi-web>=0.2,<0.3", "luigi-web-tasks>=0.2,<0.3", "luigi-web-discipline>=0.2,<0.3", "luigi-web-media>=0.2,<0.3", "fastapi==0.115.0", "httpx==0.27.2", "github-copilot-sdk==1.0.11"]

[project.entry-points."luigi_web.modules"]
assistant = "luigi_web.modules.assistant.manifest:module"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["luigi_web.modules.assistant*"]
namespaces = true

[tool.setuptools.package-data]
"luigi_web.modules.assistant" = ["templates/**/*.html", "static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.env*", "**/LOCAL_*", "**/*.db*", "**/*.sqlite*", "**/*credentials*"]