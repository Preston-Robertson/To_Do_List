[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luigi-web-discipline"
version = "0.2.0"
description = "Luigi Web habit tracking and history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["luigi-web>=0.2,<0.3", "luigi-web-tasks>=0.2,<0.3", "fastapi==0.115.0", "sqlalchemy==2.0.34"]

[project.entry-points."luigi_web.modules"]
discipline = "luigi_web.modules.discipline.manifest:module"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["luigi_web.modules.discipline*"]
namespaces = true

[tool.setuptools.package-data]
"luigi_web.modules.discipline" = ["templates/**/*.html", "static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.env*", "**/LOCAL_*", "**/*.db*", "**/*.sqlite*", "**/*credentials*"]