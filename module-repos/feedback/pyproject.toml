[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luigi-web-feedback"
version = "0.2.0"
description = "Luigi Web local feedback and privacy-screened maintainer queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["luigi-web>=0.2,<0.3", "fastapi==0.115.0", "jinja2==3.1.4", "httpx==0.27.2", "uvicorn[standard]==0.30.6", "github-copilot-sdk==1.0.11"]

[project.entry-points."luigi_web.modules"]
feedback = "luigi_web.modules.feedback.manifest:module"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["luigi_web.modules.feedback*"]
namespaces = true

[tool.setuptools.package-data]
"luigi_web.modules.feedback" = ["templates/**/*.html", "static/**/*", "maintainer-policy.md"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.env*", "**/LOCAL_*", "**/*.db*", "**/*.sqlite*", "**/*credentials*"]