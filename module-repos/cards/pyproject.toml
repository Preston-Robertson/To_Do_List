[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luigi-web-cards"
version = "0.2.0"
description = "Luigi Web trading card catalog, decks and collection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["luigi-web>=0.2,<0.3", "fastapi==0.115.0", "httpx==0.27.2", "ijson==3.3.0", "jinja2==3.1.4", "starlette>=0.37.2,<0.39"]

[project.entry-points."luigi_web.modules"]
cards = "luigi_web.modules.cards.manifest:module"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["luigi_web.modules.cards*"]
namespaces = true

[tool.setuptools.package-data]
"luigi_web.modules.cards" = ["templates/**/*.html", "static/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/.env*", "**/LOCAL_*", "**/*.db*", "**/*.sqlite*", "**/*credentials*"]