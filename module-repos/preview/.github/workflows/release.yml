name: Build Release Wheel

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the package version")
          PY
      - name: Install build tools only
        run: python -m pip install 'setuptools>=68' wheel build
      - name: Build without runtime dependencies
        run: python -m build --wheel --no-isolation
      - name: Test package contracts
        run: python -m unittest discover -s tests -v
      - name: Hash release wheels
        working-directory: dist
        run: sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Publish wheel and checksums to the exact GitHub Release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.whl dist/SHA256SUMS
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/*.whl dist/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi