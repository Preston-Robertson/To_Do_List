name: Maintainer PR validation

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintainer-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LUIGI_WEB_LLM_PROVIDER: disabled
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PLAYWRIGHT_BROWSERS_PATH: /tmp/luigi-playwright
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "setuptools>=68" wheel "packaging>=24,<27" "tzdata>=2024.1" "playwright==1.55.0" "Pillow==11.3.0"

      - name: Install local test browser
        run: python -m playwright install --with-deps chromium

      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile templates and validate routes
        run: python scripts/validate_repo.py

      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --format= --check HEAD
          fi
