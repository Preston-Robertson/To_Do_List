name: Maintainer PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maintainer-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LUIGI_WEB_LLM_PROVIDER: disabled
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "setuptools>=68" wheel

      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile templates and validate routes
        run: python scripts/validate_repo.py

      - name: Check changed-file whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
