[Service]
SupplementaryGroups=luigi-maintainer-queue
WorkingDirectory=/opt/luigi-web
Environment=LUIGI_MAINTAINER_QUEUE_DIR=/var/lib/luigi-maintainer-queue
Environment=LUIGI_WEB_MAINTAINER_DB=/var/lib/luigi-maintainer-queue/maintainer.db
Environment=LUIGI_MAINTAINER_ARTIFACT_DIR=/var/lib/luigi-maintainer-queue/review-artifacts
Environment=LUIGI_MAINTAINER_PREVIEW_STATE_DIR=/var/lib/luigi-maintainer-preview
UnsetEnvironment=LUIGI_WEB_UI_TOKEN LUIGI_WEB_FINANCE_TOKEN LUIGI_WEB_DEPLOY_TOKEN LUIGI_WEB_LLM_API_KEY
UMask=0007
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ReadOnlyPaths=/opt/luigi-web
ReadWritePaths=/var/lib/luigi-maintainer-queue
InaccessiblePaths=-/opt/luigi-web/data -/var/lib/luigi-web
InaccessiblePaths=-/opt/luigi-web/.env -/opt/luigi-web/luigi.env
InaccessiblePaths=-/opt/luigi-web/gnw-credentials.json -/opt/luigi-web/task-web-metadata.json
InaccessiblePaths=-/opt/luigi-web/LOCAL_DEPLOYMENT.md -/opt/luigi-web/LOCAL_FEATURE_REQUESTS.md
InaccessiblePaths=/etc/luigi-web
AmbientCapabilities=
LimitCORE=0
