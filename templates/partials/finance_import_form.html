<div><h2>Import transactions</h2><p class="finance-form-privacy">CSV is parsed in memory and not retained. Remove names, account numbers, and statement identifiers before upload.</p><form class="entity-form" hx-post="/finance/import/preview" hx-target="#finance-import-preview" hx-encoding="multipart/form-data"><label>Account <select name="account_id" required>{% for account in accounts %}<option value="{{ account.id }}">{{ account.name }}</option>{% endfor %}</select></label><label>UTF-8 CSV <input type="file" name="file" accept=".csv,text/csv" required></label><p class="muted-hint">Required columns: <code>date</code>, <code>amount</code>, <code>category</code>. Optional: <code>memo</code>. Income is positive; spending is negative.</p><div class="form-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary">Preview import</button></div></form><div id="finance-import-preview"></div></div>
