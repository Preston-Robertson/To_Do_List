<div class="finance-import-preview"><h3>Import preview</h3><p>{{ preview.total }} rows · {{ preview.duplicates }} duplicate(s) will be skipped.</p><div class="finance-import-table"><table class="data-table"><thead><tr><th>Date</th><th>Category</th><th>Memo</th><th>Amount</th><th>Status</th></tr></thead><tbody>{% for row in preview.rows %}<tr class="{% if row.duplicate %}is-duplicate{% endif %}"><td>{{ row.transaction_date }}</td><td>{{ row.category }}</td><td>{{ row.memo or '—' }}</td><td>{{ row.amount }}</td><td>{{ 'Duplicate' if row.duplicate else 'Ready' }}</td></tr>{% endfor %}</tbody></table></div><form hx-post="/finance/import/commit" hx-swap="none"><input type="hidden" name="token" value="{{ preview.token }}"><div class="form-actions"><button class="btn btn-primary">Import {{ preview.total - preview.duplicates }} rows</button></div></form></div>
