<form class="entity-form" hx-post="/finance/budgets" hx-swap="none"><h2>Add monthly budget</h2><div class="form-row"><label>Month <input type="month" name="month" required value="{{ month }}"></label><label>Limit <input type="number" step="0.01" min="0.01" name="limit" required></label></div><label>Category <input name="category" required maxlength="60" placeholder="Groceries"></label><div class="form-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary">Save budget</button></div></form>
