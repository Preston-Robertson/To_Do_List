<form class="entity-form" hx-post="/finance/transactions" hx-swap="none">
  <h2>Record transaction</h2>
  <p class="finance-form-privacy">Use a generic memo. Do not enter names, account numbers, addresses, emails, or phone numbers.</p>
  <label>Account <select name="account_id" required>{% for account in accounts %}<option value="{{ account.id }}">{{ account.name }} · {{ account.currency }}</option>{% endfor %}</select></label>
  <div class="form-row"><label>Date <input type="date" name="transaction_date" required value="{{ today }}"></label><label>Amount <input type="number" step="0.01" name="amount" required placeholder="-0.00"><small>Income is positive; spending is negative.</small></label></div>
  <label>Category <input name="category" required maxlength="60" placeholder="Groceries"></label>
  <label>Memo <input name="memo" maxlength="120" placeholder="Optional generic description"></label>
  <div class="form-actions"><button type="button" class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-primary" type="submit">Record</button></div>
</form>
